<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KELFA QUEST - Cover Home | Matematika Kelas V SD</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#060f2e;
    overflow:hidden;
    font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    user-select:none;
    -webkit-user-select:none;
  }
  /* Area luar stage (letterbox) */
  #viewport {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, #10266b 0%, #060f2e 65%, #020618 100%);
  }
  /* STAGE TETAP 1920x1080 */
  #stage {
    width:1920px; height:1080px;
    position:relative;
    flex-shrink:0;
    overflow:hidden;
    background:#7ec8f7;
    box-shadow: 0 0 80px rgba(0,0,0,.6);
    transform-origin:center center;
  }
  #bg-cover {
    position:absolute; inset:0;
    width:1920px; height:1080px;
    object-fit:fill;
    display:block;
  }

  /* Tombol Mulai - bulat play, posisi podium tengah bawah */
  #btn-mulai {
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom:205px;
    width:230px; height:230px;
    cursor:pointer;
    border:none; background:none; padding:0;
    border-radius:50%;
    filter: drop-shadow(0 12px 18px rgba(0,30,120,.45));
    transition: transform .18s ease, filter .18s ease;
    animation: popIn 0.9s cubic-bezier(.2,1.5,.3,1) .4s both,
               floatY 2.8s ease-in-out 1.4s infinite;
    z-index:5;
  }
  #btn-mulai img { width:100%; height:100%; display:block; pointer-events:none; border-radius:50%; transition:transform .12s ease, filter .12s ease; transform-origin:center; }
  #btn-mulai:hover { transform:translateX(-50%) scale(1.06); filter: drop-shadow(0 16px 26px rgba(0,30,120,.55)) brightness(1.06); }
  #btn-mulai:active { transform:translateX(-50%) scale(.94); }
  #btn-mulai:active img { transform:scale(.86); filter:brightness(.88); }
  /* class .pressed dipicu via JS untuk efek memantul + gelombang */
  #btn-mulai.pressed img { animation:squash .42s cubic-bezier(.2,1.6,.3,1); }
  #btn-setting.pressed img { animation:squash .42s cubic-bezier(.2,1.6,.3,1); }
  #btn-tutup.pressed { animation:btnPop .38s cubic-bezier(.2,1.6,.3,1); }
  .toggle.pressed { animation:btnPop .3s ease; }

  @keyframes popIn {
    from { opacity:0; transform:translateX(-50%) translateY(80px) scale(.7); }
    to { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }
  @keyframes floatY {
    0%,100% { margin-bottom:0; }
    50% { margin-bottom:14px; }
  }

  /* Tombol Pengaturan kanan atas */
  #btn-setting {
    position:absolute;
    top:36px; right:42px;
    width:118px; height:118px;
    border:none; background:none; cursor:pointer;
    z-index:6;
    transition: transform .18s ease;
    animation: popIn2 .7s cubic-bezier(.2,1.5,.3,1) .7s both;
  }
  #btn-setting img { width:100%; height:100%; display:block; pointer-events:none; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); transition:transform .12s ease; transform-origin:center; }
  #btn-setting:hover { transform:scale(1.1) rotate(15deg); }
  #btn-setting:active { transform:scale(.88) rotate(5deg); }
  #btn-setting:active img { transform:scale(.86); filter:brightness(.9); }
  @keyframes popIn2 { from { opacity:0; transform:scale(.5);} to { opacity:1; transform:scale(1);} }

  /* ===== EFEK PENCET UNIVERSAL: squash + gelombang + partikel ===== */
  @keyframes squash {
    0% { transform:scale(1,1); }
    30% { transform:scale(.82,.82); }
    55% { transform:scale(1.14,1.14); }
    75% { transform:scale(.94,.94); }
    100% { transform:scale(1,1); }
  }
  @keyframes btnPop {
    0% { transform:scale(1); }
    35% { transform:scale(.88); }
    60% { transform:scale(1.08); }
    100% { transform:scale(1); }
  }
  #btn-mulai, #btn-setting, #btn-tutup { overflow:visible; }
  #btn-tutup { position:relative; }
  .press-ring {
    position:absolute; left:50%; top:50%;
    width:100%; height:100%;
    border:6px solid rgba(255,210,60,.95);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(.7);
    opacity:.95; pointer-events:none; z-index:10;
    animation:ringOut .55s ease-out forwards;
  }
  #btn-tutup .press-ring { border-radius:999px; }
  @keyframes ringOut {
    to { transform:translate(-50%,-50%) scale(1.65); opacity:0; }
  }
  .press-star {
    position:absolute; left:50%; top:50%;
    width:16px; height:16px; margin:-8px;
    background:radial-gradient(circle, #fff 0 30%, #ffd93c 45%, transparent 70%);
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    pointer-events:none; z-index:11;
    animation:starFly .6s ease-out forwards;
  }
  @keyframes starFly {
    from { transform:translate(0,0) scale(.6) rotate(0); opacity:1; }
    to { transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(180deg); opacity:0; }
  }

  /* Badge Fase C - kiri bawah info (pure CSS, tidak menutup aset) */
  #fase-hint {
    position:absolute; left:42px; bottom:30px;
    z-index:4;
    color:#fff; font-weight:800; font-size:22px;
    letter-spacing:.5px;
    text-shadow: 0 2px 0 #0b2a8a, 0 4px 12px rgba(0,0,0,.5);
    background:rgba(8,30,110,.55);
    border:2px solid rgba(255,255,255,.7);
    padding:10px 22px; border-radius:999px;
    backdrop-filter: blur(4px);
  }

  /* Hint klik untuk audio */
  #audio-hint {
    position:absolute; left:50%; top:22px; transform:translateX(-50%);
    z-index:4;
    background:rgba(0,20,80,.65); color:#ffe27a;
    font-size:20px; font-weight:700;
    padding:10px 26px; border-radius:999px;
    border:1.5px solid rgba(255,226,122,.7);
    display:none;
  }

  /* ===== MODAL PENGATURAN ===== */
  #overlay {
    position:absolute; inset:0; z-index:20;
    background:rgba(4,12,45,.65);
    display:none; align-items:center; justify-content:center;
    backdrop-filter: blur(3px);
  }
  #overlay.show { display:flex; }
  #panel-setting {
    width:720px;
    background: linear-gradient(180deg, #1a56d6 0%, #0d2fa0 100%);
    border:10px solid #ffb300;
    outline:6px solid #7a4a12;
    border-radius:36px;
    padding:38px 48px 42px;
    color:#fff;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
    animation: panelIn .35s cubic-bezier(.2,1.4,.3,1);
    position:relative;
  }
  @keyframes panelIn { from { transform:scale(.8) translateY(30px); opacity:0;} to { transform:scale(1) translateY(0); opacity:1;} }
  #panel-setting h2 {
    text-align:center; font-size:52px; line-height:1;
    color:#fff; -webkit-text-stroke:2px #0a205f;
    text-shadow:0 4px 0 #0a205f, 0 6px 0 rgba(0,0,0,.25);
    margin-bottom:8px; letter-spacing:1px;
  }
  #panel-setting p.sub { text-align:center; color:#ffe27a; font-weight:700; font-size:22px; margin-bottom:28px; }
  .row-setting {
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.35);
    border-radius:20px; padding:18px 24px; margin-bottom:18px;
    font-size:28px; font-weight:800;
  }
  .toggle {
    width:110px; height:56px; border-radius:999px;
    background:#5a6a8a; border:3px solid #fff;
    position:relative; cursor:pointer; transition:.2s;
    flex-shrink:0;
  }
  .toggle::after {
    content:""; position:absolute; top:4px; left:5px;
    width:42px; height:42px; border-radius:50%;
    background:#fff; transition:.2s;
    box-shadow:0 3px 6px rgba(0,0,0,.3);
  }
  .toggle.on { background:#22c55e; }
  .toggle.on::after { left:55px; }
  #vol { width:100%; height:14px; accent-color:#ffb300; cursor:pointer; }
  #btn-tutup {
    display:block; margin:26px auto 0;
    font-size:30px; font-weight:900; color:#0a2a8a;
    background:linear-gradient(180deg,#ffe27a,#ffb300);
    border:none; border-radius:999px; padding:16px 86px;
    cursor:pointer; box-shadow:0 8px 0 #7a4a12, 0 12px 20px rgba(0,0,0,.3);
    transition:.15s;
  }
  #btn-tutup:hover { transform:scale(1.05); }
  #btn-tutup:active { transform:translateY(4px); box-shadow:0 4px 0 #7a4a12; }

  /* Toast kecil untuk navigasi berikutnya */
  #toast {
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#0a205f; color:#fff; font-size:22px; font-weight:700;
    padding:14px 30px; border-radius:999px; border:2px solid #ffb300;
    opacity:0; pointer-events:none; transition:.3s; z-index:30; white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== LAYAR HOME & MENU (SPA, tetap 1920x1080) ===== */
  .screen { position:absolute; inset:0; transition:opacity .45s ease; opacity:0; pointer-events:none; }
  .screen.active { opacity:1; pointer-events:auto; }
  #screen-home { z-index:1; }
  #screen-intro { z-index:2; }
  #screen-tujuan { z-index:3; }
  #screen-menu { z-index:4; }
  .bg-full { position:absolute; inset:0; width:1920px; height:1080px; object-fit:fill; display:block; }
  /* Navigasi kiri atas khusus menu */
  .nav-topleft { position:absolute; top:36px; left:42px; display:flex; gap:22px; z-index:6; }
  .nav-btn {
    width:118px; height:118px;
    border:none; background:none; cursor:pointer; padding:0; overflow:visible;
    transition:transform .18s ease;
    animation:popIn2 .7s cubic-bezier(.2,1.5,.3,1) .3s both;
  }
  .nav-btn img { width:100%; height:100%; display:block; pointer-events:none; border-radius:50%;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.35)); transition:transform .12s ease; }
  .nav-btn:hover { transform:scale(1.1); }
  .nav-btn:active { transform:scale(.88); }
  .nav-btn:active img { transform:scale(.86); filter:brightness(.9); }
  .nav-btn.pressed img { animation:squash .42s cubic-bezier(.2,1.6,.3,1); }

  /* ===== TOMBOL MATERI KPK & FPB ===== */
  .materi-wrap {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:300px;
    display:flex; gap:80px; z-index:5;
  }
  .materi-btn {
    width:340px; cursor:pointer;
    border:none; background:none; padding:0; overflow:visible;
    filter:drop-shadow(0 14px 20px rgba(0,30,120,.45));
    transition:transform .18s ease, filter .18s ease;
    animation:materiIn .8s cubic-bezier(.2,1.4,.3,1) both;
  }
  #btn-fpb { animation-delay:.15s; }
  .materi-btn img { width:100%; display:block; pointer-events:none; transition:transform .12s ease; }
  .materi-btn:hover { transform:scale(1.06); filter:drop-shadow(0 18px 28px rgba(0,30,120,.55)) brightness(1.05); }
  .materi-btn:active { transform:scale(.94); }
  .materi-btn:active img { transform:scale(.9); filter:brightness(.9); }
  .materi-btn.pressed img { animation:squash .42s cubic-bezier(.2,1.6,.3,1); }
  .materi-btn .press-ring { border-radius:36px; }
  @keyframes materiIn {
    from { opacity:0; transform:translateY(90px) scale(.7); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }

  /* ===== PENGENALAN & TUJUAN (Background 1) ===== */
  .board-wrap {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-54%);
    width:1340px; z-index:5;
  }
  .board-wrap > img { width:100%; display:block; pointer-events:none; filter:drop-shadow(0 18px 26px rgba(0,20,90,.35)); }
  .board-text {
    position:absolute;
    left:45px; right:45px; top:42px; bottom:42px;
    padding:38px 46px 38px 50px;
    color:#12307a; text-align:left;
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:thin;
    scrollbar-color:#1a56d6 #dbe6ff;
  }
  /* teks hanya bisa diklik/di-scroll saat layarnya aktif (agar tidak memblokir tombol layar lain) */
  .screen.active .board-text { pointer-events:auto; }
  .board-text::-webkit-scrollbar { width:16px; }
  .board-text::-webkit-scrollbar-track { background:#dbe6ff; border-radius:999px; }
  .board-text::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#2f7bff,#0d2fa0); border-radius:999px; border:3px solid #dbe6ff; }
  .board-text h3 { font-size:50px; line-height:1.15; color:#0d2a8a; margin-bottom:14px; }
  .board-text p { font-size:28px; line-height:1.55; font-weight:600; color:#1c3a86; margin-bottom:14px; text-align:justify; }
  .page-icon { position:absolute; left:50%; transform:translateX(-50%); top:78px; width:480px; z-index:6; pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.3)); }
  /* tombol navigasi bawah */
  .nav-next, .nav-prev {
    position:absolute; bottom:56px; z-index:6;
    width:150px; height:150px; border:none; background:none; cursor:pointer; padding:0; overflow:visible;
    transition:transform .18s ease;
  }
  .nav-next { right:64px; }
  .nav-prev { left:64px; }
  .nav-next img, .nav-prev img { width:100%; height:100%; display:block; pointer-events:none; border-radius:50%;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.35)); transition:transform .12s ease; }
  .nav-next:hover, .nav-prev:hover { transform:scale(1.08); }
  .nav-next:active, .nav-prev:active { transform:scale(.9); }
  .nav-next.pressed img, .nav-prev.pressed img { animation:squash .42s cubic-bezier(.2,1.6,.3,1); }
  /* Tombol Mulai Belajar: DI DALAM balon percakapan, muncul setelah kalimat terakhir selesai */
  #btn-mulai-belajar {
    display:none;
    position:relative;
    margin:28px auto 0;
    width:320px; cursor:pointer; border:none; background:none; padding:0; overflow:visible;
    filter:drop-shadow(0 12px 18px rgba(0,30,120,.40));
    transition:transform .18s ease, filter .18s ease;
  }
  #btn-mulai-belajar.show { display:block; animation:ctaIn .55s cubic-bezier(.2,1.5,.3,1); }
  @keyframes ctaIn {
    from { opacity:0; transform:translateY(28px) scale(.82); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  #btn-mulai-belajar img { width:100%; display:block; pointer-events:none; transition:transform .12s ease; }
  #btn-mulai-belajar:hover { transform:scale(1.05); filter:brightness(1.06) drop-shadow(0 12px 18px rgba(0,30,120,.40)); }
  #btn-mulai-belajar:active { transform:scale(.94); }
  #btn-mulai-belajar.pressed img { animation:squash .42s cubic-bezier(.2,1.6,.3,1); }
  #btn-mulai-belajar .press-ring { border-radius:40px; }
  /* saat tombol muncul: petunjuk "klik untuk lanjut" & titik progres disembunyikan */
  .bubble.done .ket { display:none; }
  #intro-dots { transition:opacity .45s ease; }
  #intro-dots.done { opacity:0; }

  /* ===== PEMBUKA: KARAKTER RAYA + BALON TALK BUBBLE ===== */
  .raya-stage { position:absolute; left:170px; bottom:96px; height:740px; z-index:5; }
  .raya-stage img {
    height:100%; width:auto; display:block; pointer-events:none;
    filter:drop-shadow(0 20px 26px rgba(0,20,90,.35));
    animation:rayaIdle 2.6s ease-in-out infinite;
  }
  .raya-stage img.pop { animation:rayaPop .55s cubic-bezier(.2,1.6,.3,1); }
  @keyframes rayaIdle {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50% { transform:translateY(-14px) rotate(-1.2deg); }
  }
  @keyframes rayaPop {
    0% { transform:scale(.7) rotate(-7deg); opacity:0; }
    60% { transform:scale(1.09) rotate(2.5deg); opacity:1; }
    100% { transform:scale(1) rotate(0); }
  }
  .bubble {
    position:absolute; right:104px; top:206px; width:960px; min-height:262px;
    background:#fff; border:9px solid #ffb300; border-radius:52px;
    padding:40px 58px 56px;
    box-shadow:0 22px 44px rgba(0,20,90,.3);
    z-index:5; cursor:pointer; overflow:visible;
    animation:bubbleIn .5s cubic-bezier(.2,1.4,.3,1);
  }
  .bubble.in { animation:bubbleIn .5s cubic-bezier(.2,1.4,.3,1); }
  .bubble::before {
    content:""; position:absolute; left:-53px; top:104px; width:0; height:0;
    border-top:37px solid transparent; border-bottom:37px solid transparent; border-right:53px solid #ffb300;
  }
  .bubble::after {
    content:""; position:absolute; left:-44px; top:111px; width:0; height:0;
    border-top:30px solid transparent; border-bottom:30px solid transparent; border-right:44px solid #fff;
  }
  @keyframes bubbleIn {
    from { opacity:0; transform:translateX(40px) scale(.9); }
    to { opacity:1; transform:translateX(0) scale(1); }
  }
  .bubble .nama {
    display:block; font-size:23px; color:#e08a00; font-weight:900;
    letter-spacing:3px; margin-bottom:8px;
  }
  .bubble p { margin:0; font-size:37px; line-height:1.5; font-weight:800; color:#12307a; min-height:1.5em; text-align:left; }
  .bubble .ket {
    position:absolute; right:32px; bottom:14px;
    font-size:19px; color:#8a9ac4; font-weight:700;
    display:flex; align-items:center; gap:10px;
  }
  .bubble .ket-arrow {
    width:0; height:0;
    border-top:8px solid transparent; border-bottom:8px solid transparent;
    border-left:13px solid #ffb000;
    animation:ketNudge 1.3s ease-in-out infinite;
  }
  @keyframes ketNudge {
    0%,100% { transform:translateX(0); opacity:.6; }
    50% { transform:translateX(6px); opacity:1; }
  }
  .dots {
    position:absolute; right:104px; top:600px; width:960px;
    display:flex; gap:16px; justify-content:center; z-index:5;
  }
  .dots i {
    width:22px; height:22px; border-radius:50%;
    background:#fff; border:5px solid #1a56d6; opacity:.42; transition:.3s;
  }
  .dots i.on { opacity:1; background:#ffb000; transform:scale(1.3); }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" aria-label="KELFA QUEST 1920x1080">
    <!-- ===== LAYAR 1: HOME ===== -->
    <div id="screen-home" class="screen active">
      <img id="bg-cover" class="bg-full" src="Asset/Cover%20home.png" alt="Cover Home KELFA QUEST Matematika Kelas V SD" draggable="false" />
      <div id="audio-hint">🔊 Klik di mana saja untuk mengaktifkan suara</div>
      <!-- Tombol utama -->
      <button id="btn-mulai" aria-label="Mulai">
        <img src="Asset/Tombol%20mulai.png" alt="Tombol Mulai" draggable="false" />
      </button>
      <!-- Tombol pengaturan (home, kanan atas) -->
      <button id="btn-setting" aria-label="Pengaturan">
        <img src="Asset/Tombol%20pengaturan.png" alt="Pengaturan" draggable="false" />
      </button>
      <!-- badge kiri bawah dihapus sesuai permintaan -->
    </div>

    <!-- ===== LAYAR 2: PENGENALAN AWAL (Background 1) ===== -->
    <div id="screen-intro" class="screen" aria-label="Pengenalan">
      <img class="bg-full" src="Asset/Background%201.png" alt="Background" draggable="false" />
      <div class="nav-topleft">
        <button id="btn-home-intro" class="nav-btn" aria-label="Kembali ke Home">
          <img src="Asset/Home.png" alt="Home" draggable="false" />
        </button>
        <button id="btn-setting-intro" class="nav-btn" aria-label="Pengaturan">
          <img src="Asset/Tombol%20pengaturan.png" alt="Pengaturan" draggable="false" />
        </button>
      </div>
      <!-- Karakter Raya (ekspresi ikut berubah mengikuti dialog) -->
      <div class="raya-stage">
        <img id="raya-img" src="Asset/Animasi%20anak/transparan/Menyapa.png" alt="Raya" draggable="false" />
      </div>

      <!-- Balon percakapan -->
      <div id="bubble" class="bubble">
        <span class="nama">RAYA</span>
        <p id="bubble-text"></p>
        <!-- Tombol Mulai Belajar di dalam balon (muncul setelah kalimat terakhir) -->
        <button id="btn-mulai-belajar" aria-label="Mulai Belajar">
          <img src="Asset/Tombol%20Mulai%20Belajar.png" alt="Mulai Belajar" draggable="false" />
        </button>
        <span class="ket">klik untuk lanjut<span class="ket-arrow"></span></span>
      </div>
      <div id="intro-dots" class="dots"></div>
    </div>

    <!-- ===== LAYAR 3: TUJUAN PEMBELAJARAN (Background 1) ===== -->
    <div id="screen-tujuan" class="screen" aria-label="Tujuan Pembelajaran">
      <img class="bg-full" src="Asset/Background%201.png" alt="Background" draggable="false" />
      <div class="nav-topleft">
        <button id="btn-home-tujuan" class="nav-btn" aria-label="Kembali ke Home">
          <img src="Asset/Home.png" alt="Home" draggable="false" />
        </button>
        <button id="btn-setting-tujuan" class="nav-btn" aria-label="Pengaturan">
          <img src="Asset/Tombol%20pengaturan.png" alt="Pengaturan" draggable="false" />
        </button>
      </div>
      <div class="board-wrap">
        <img src="Asset/Papan%20Tulis%20.png" alt="Papan Tulis" draggable="false" />
      </div>
      <button id="btn-prev-tujuan" class="nav-prev" aria-label="Sebelumnya">
        <img src="Asset/Sebelumnya.png" alt="Sebelumnya" draggable="false" />
      </button>
      <button id="btn-next-tujuan" class="nav-next" aria-label="Selanjutnya">
        <img src="Asset/Selanjutnya.png" alt="Selanjutnya" draggable="false" />
      </button>
    </div>

    <!-- ===== LAYAR 2: MENU MATERI (cover dulu) ===== -->
    <div id="screen-menu" class="screen" aria-label="Menu Materi">
      <img id="bg-menu" class="bg-full" src="Asset/cover%20menu.png" alt="Menu Materi" draggable="false" />
      <!-- Tombol Home + Pengaturan di sudut kiri atas -->
      <div class="nav-topleft">
        <button id="btn-home-menu" class="nav-btn" aria-label="Kembali ke Home">
          <img src="Asset/Home.png" alt="Home" draggable="false" />
        </button>
        <button id="btn-setting-menu" class="nav-btn" aria-label="Pengaturan">
          <img src="Asset/Tombol%20pengaturan.png" alt="Pengaturan" draggable="false" />
        </button>
      </div>
      <!-- Tombol Materi KPK & FPB -->
      <div class="materi-wrap">
        <button id="btn-kpk" class="materi-btn" aria-label="Materi KPK">
          <img src="Asset/Menu%20KPK.png" alt="Materi KPK" draggable="false" />
        </button>
        <button id="btn-fpb" class="materi-btn" aria-label="Materi FPB">
          <img src="Asset/Menu%20FPB.png" alt="Materi FPB" draggable="false" />
        </button>
      </div>
      <button id="btn-prev-menu" class="nav-prev" aria-label="Sebelumnya">
        <img src="Asset/Sebelumnya.png" alt="Sebelumnya" draggable="false" />
      </button>
    </div>

    <!-- Modal Pengaturan -->
    <div id="overlay">
      <div id="panel-setting" role="dialog" aria-modal="true" aria-label="Pengaturan Suara">
        <h2>PENGATURAN</h2>
        <p class="sub">Atur suara dan tampilan</p>
        <div class="row-setting">
          <span>🎵 Musik Latar</span>
          <div id="tg-music" class="toggle on" role="switch" aria-checked="true" tabindex="0"></div>
        </div>
        <div class="row-setting">
          <span>🔔 Efek Suara</span>
          <div id="tg-sfx" class="toggle on" role="switch" aria-checked="true" tabindex="0"></div>
        </div>
        <div class="row-setting">
          <span>⛶ Layar Penuh</span>
          <div id="tg-full" class="toggle" role="switch" aria-checked="false" tabindex="0"></div>
        </div>
        <div class="row-setting" style="display:block">
          <span style="display:block; margin-bottom:12px">🔊 Volume Musik Latar</span>
          <input id="vol" type="range" min="0" max="100" value="100" />
        </div>
        <button id="btn-tutup">TUTUP</button>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<!-- AUDIO -->
<audio id="bgm" src="Asset/Sound/Musik%20Background.mp3" loop preload="auto"></audio>
<audio id="sfx-klik" src="Asset/Sound/Klik%20button.mp3" preload="auto"></audio>
<audio id="vo-pengenalan" src="Asset/Sound/Teks%20pengenalan.wav" preload="auto"></audio>

<script>
(function(){
  // ===== 1. SCALING FIXED 1920x1080 =====
  // Stage selalu 1920x1080, diskala agar pas di layar apa pun tanpa distorsi.
  var stage = document.getElementById('stage');
  function fitStage(){
    var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  // ===== 2. AUDIO =====
  var bgm = document.getElementById('bgm');
  var sfxKlik = document.getElementById('sfx-klik');
  var audioHint = document.getElementById('audio-hint');
  var musicOn = true, sfxOn = true;
  // Musik latar 30% = 0.3, SFX full 100% = 1.0
  bgm.volume = 0.3;
  sfxKlik.volume = 1.0;

  // Browser memblokir autoplay -> musik mulai setelah interaksi pertama
  var unlocked = false;
  function unlockAudio(){
    if(unlocked) return; unlocked = true;
    audioHint.style.display = 'none';
    if(musicOn){ bgm.play().catch(function(){}); }
  }
  // Tampilkan hint jika autoplay diblokir
  setTimeout(function(){
    if(bgm.paused && !unlocked){ audioHint.style.display = 'block'; }
  }, 800);
  document.addEventListener('pointerdown', unlockAudio, {once:false});
  document.addEventListener('keydown', unlockAudio);

  function playKlik(){
    if(!sfxOn) return;
    try{ sfxKlik.currentTime = 0; sfxKlik.play().catch(function(){}); }catch(e){}
  }

  // ===== 3. MODAL PENGATURAN =====
  var overlay = document.getElementById('overlay');
  var btnSetting = document.getElementById('btn-setting');
  var btnSettingMenu = document.getElementById('btn-setting-menu');
  var btnSettingIntro = document.getElementById('btn-setting-intro');
  var btnSettingTujuan = document.getElementById('btn-setting-tujuan');
  var btnHomeMenu = document.getElementById('btn-home-menu');
  var btnTutup = document.getElementById('btn-tutup');
  var tgMusic = document.getElementById('tg-music');
  var tgSfx = document.getElementById('tg-sfx');
  var tgFull = document.getElementById('tg-full');
  var vol = document.getElementById('vol');

  function openSetting(e){ if(e){ e.stopPropagation(); } playKlik(); overlay.classList.add('show'); }
  btnSetting.addEventListener('click', openSetting);
  btnSettingMenu.addEventListener('click', openSetting);
  btnSettingIntro.addEventListener('click', openSetting);
  btnSettingTujuan.addEventListener('click', openSetting);
  btnTutup.addEventListener('click', function(){ playKlik(); overlay.classList.remove('show'); });
  overlay.addEventListener('click', function(e){ if(e.target===overlay){ overlay.classList.remove('show'); } });

  function setToggle(el, on){ el.classList.toggle('on', on); el.setAttribute('aria-checked', on ? 'true':'false'); }
  tgMusic.addEventListener('click', function(){
    musicOn = !musicOn; setToggle(tgMusic, musicOn); playKlik();
    if(musicOn){ bgm.play().catch(function(){}); } else { bgm.pause(); }
  });
  tgSfx.addEventListener('click', function(){
    sfxOn = !sfxOn; setToggle(tgSfx, sfxOn); playKlik();
  });
  // Fullscreen ON/OFF
  function isFull(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateFullToggle(){ setToggle(tgFull, isFull()); }
  tgFull.addEventListener('click', function(){
    playKlik();
    try{
      if(!isFull()){
        var el = document.documentElement;
        if(el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
        else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
      } else {
        if(document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
        else if(document.webkitExitFullscreen){ document.webkitExitFullscreen(); }
      }
    }catch(e){}
    setTimeout(updateFullToggle, 300);
  });
  document.addEventListener('fullscreenchange', updateFullToggle);
  document.addEventListener('webkitfullscreenchange', updateFullToggle);
  vol.addEventListener('input', function(){
    var m = vol.value/100;
    bgm.volume = m * 0.3; // hanya musik latar, SFX tetap full
  });

  // ===== 4. NAVIGASI: HOME -> PENGENALAN -> TUJUAN -> MENU MATERI =====
  var btnMulai = document.getElementById('btn-mulai');
  var btnPrevTujuan = document.getElementById('btn-prev-tujuan');
  var btnNextTujuan = document.getElementById('btn-next-tujuan');
  var btnMulaiBelajar = document.getElementById('btn-mulai-belajar');
  var btnPrevMenu = document.getElementById('btn-prev-menu');
  var btnHomeIntro = document.getElementById('btn-home-intro');
  var btnHomeTujuan = document.getElementById('btn-home-tujuan');
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
  }
  // Ganti layar aktif (hanya satu .screen.active)
  var screens = ['screen-home','screen-intro','screen-tujuan','screen-menu'];
  function showScreen(id){
    screens.forEach(function(s){
      document.getElementById(s).classList.toggle('active', s===id);
    });
    if(id === 'screen-intro'){ startIntro(); } else { stopIntro(); }
  }
  function currentScreen(){
    for(var i=0;i<screens.length;i++){
      if(document.getElementById(screens[i]).classList.contains('active')) return screens[i];
    }
    return 'screen-home';
  }
  btnMulai.addEventListener('click', function(){ playKlik(); showScreen('screen-intro'); });
  btnPrevTujuan.addEventListener('click', function(){ playKlik(); showScreen('screen-intro'); });
  // jangan teruskan klik ke balon (balon = lanjut dialog)
  btnMulaiBelajar.addEventListener('click', function(e){ if(e && e.stopPropagation) e.stopPropagation(); playKlik(); showScreen('screen-tujuan'); });
  btnNextTujuan.addEventListener('click', function(){ playKlik(); showScreen('screen-menu'); });
  btnPrevMenu.addEventListener('click', function(){ playKlik(); showScreen('screen-tujuan'); });
  btnHomeIntro.addEventListener('click', function(){ playKlik(); showScreen('screen-home'); });
  btnHomeTujuan.addEventListener('click', function(){ playKlik(); showScreen('screen-home'); });
  btnHomeMenu.addEventListener('click', function(){ playKlik(); showScreen('screen-home'); });
  // Tombol materi (placeholder isi - step berikutnya)
  var btnKpk = document.getElementById('btn-kpk');
  var btnFpb = document.getElementById('btn-fpb');
  btnKpk.addEventListener('click', function(){
    playKlik();
    showToast('Materi KPK segera hadir 🚀');
    console.log('[KELFA QUEST] KPK diklik.');
  });
  btnFpb.addEventListener('click', function(){
    playKlik();
    showToast('Materi FPB segera hadir 🚀');
    console.log('[KELFA QUEST] FPB diklik.');
  });
  // Akses keyboard: Enter = maju / Escape = tutup
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ overlay.classList.remove('show'); return; }
    if(e.key === 'Enter' && !overlay.classList.contains('show')){
      var cur = currentScreen();
      if(cur==='screen-home'){ btnMulai.click(); }
      else if(cur==='screen-intro'){ if(btnMulaiBelajar.classList.contains('show')){ btnMulaiBelajar.click(); } else { skipIntro(); } }
      else if(cur==='screen-tujuan'){ btnNextTujuan.click(); }
    }
    if(e.key === 'ArrowRight' && !overlay.classList.contains('show')){
      if(currentScreen()==='screen-intro'){ if(btnMulaiBelajar.classList.contains('show')){ btnMulaiBelajar.click(); } else { skipIntro(); } }
      else if(currentScreen()==='screen-tujuan'){ btnNextTujuan.click(); }
    }
    if(e.key === 'ArrowLeft' && !overlay.classList.contains('show')){
      if(currentScreen()==='screen-tujuan'){ btnPrevTujuan.click(); }
      else if(currentScreen()==='screen-menu'){ btnPrevMenu.click(); }
    }
  });

  // ===== 6. DIALOG PEMBUKA (KARAKTER RAYA) =====
  // t0/t1 = detik mulai & selesai dialog ini DALAM audio narasi
  var introData = [
    { t0:0,  t1:4,  img:'Menyapa.png', text:'Halo teman-teman, aku Raya, teman belajar kalian.' },
    { t0:4,  t1:7,  img:'Hebat.png',   text:'Selamat datang di KELFA QUEST!' },
    { t0:7,  t1:16, img:'Tau.png',     text:'Hari ini kita akan belajar tentang Kelipatan Persekutuan Terkecil (KPK) dan Faktor Persekutuan Terbesar (FPB) dengan cara yang seru dan menyenangkan.' },
    { t0:16, t1:19, img:'Kaget.png',   text:'Sudah siap belajar bersama Raya?' },
    { t0:19, t1:23, img:'Hebat.png',   text:'Yuk, kita mulai! Hihihi.' }
  ];
  var rayaImg    = document.getElementById('raya-img');
  var bubble     = document.getElementById('bubble');
  var bubbleText = document.getElementById('bubble-text');
  var introDots  = document.getElementById('intro-dots');
  var vo         = document.getElementById('vo-pengenalan');
  var typeTimer = null, syncTimer = null, curIdx = -1, wallStart = 0, ts = 1;
  var REF_END = 23; // total acuan timing (detik) -> diskalakan ke durasi audio asli
  vo.volume = 1.0;

  introData.forEach(function(){ introDots.appendChild(document.createElement('i')); });

  // skala waktu: sesuaikan acuan 23 detik dengan durasi audio yang benar-benar dipakai
  function refreshScale(){
    var d = vo.duration;
    ts = (d && isFinite(d) && d > 0) ? (d / REF_END) : 1;
  }
  vo.addEventListener('loadedmetadata', refreshScale);

  // waktu dialog berjalan (dari audio; fallback jam dinding jika audio diblokir)
  function introTime(){
    // audio selesai -> tetap di baris terakhir, jangan mundur ke jam dinding
    if(vo.ended){ return vo.duration > 0 ? vo.duration : (REF_END * ts); }
    if(!vo.paused && vo.currentTime > 0){ return vo.currentTime; }
    return (new Date().getTime() - wallStart) / 1000;
  }

  function showLine(i){
    curIdx = i;
    var d = introData[i];
    // reset tombol Mulai Belajar (hanya muncul di kalimat terakhir, setelah selesai)
    btnMulaiBelajar.classList.remove('show');
    bubble.classList.remove('done');
    introDots.classList.remove('done');
    // ekspresi ikut berubah
    rayaImg.src = 'Asset/Animasi%20anak/transparan/' + d.img;
    rayaImg.classList.remove('pop'); void rayaImg.offsetWidth; rayaImg.classList.add('pop');
    // balon masuk
    bubble.classList.remove('in'); void bubble.offsetWidth; bubble.classList.add('in');
    // titik progres
    var dots = introDots.children;
    for(var k=0;k<dots.length;k++){ dots[k].classList.toggle('on', k===i); }
    // mesin ketik, kecepatan disesuaikan agar selesai tepat di akhir blok audio
    clearInterval(typeTimer);
    bubbleText.textContent = '';
    var dur = Math.max(0, (d.t1 - d.t0)) * ts * 1000;
    var per = Math.max(16, Math.floor(dur / Math.max(1, d.text.length)));
    var c = 0;
    typeTimer = setInterval(function(){
      c++;
      bubbleText.textContent = d.text.slice(0, c);
      if(c >= d.text.length){
        clearInterval(typeTimer);
        if(i === introData.length - 1){ showCta(); }   // kalimat terakhir selesai -> tombol muncul
      }
    }, per);
  }

  // tampilkan tombol Mulai Belajar di dalam balon
  function showCta(){
    btnMulaiBelajar.classList.add('show');
    bubble.classList.add('done');
    introDots.classList.add('done');
  }

  // pantau waktu audio, pindah baris otomatis sesuai timing
  function syncLoop(){
    var t = introTime();
    var idx = -1;
    for(var i=0;i<introData.length;i++){
      if(t >= introData[i].t0 * ts && t < introData[i].t1 * ts){ idx = i; break; }
    }
    var last = introData.length - 1;
    if(idx === -1 && t >= introData[last].t1 * ts){ idx = last; }
    if(idx >= 0 && idx !== curIdx){ showLine(idx); }
  }

  function startIntro(){
    curIdx = -1;
    clearInterval(typeTimer);
    clearInterval(syncTimer);
    refreshScale();
    wallStart = new Date().getTime();
    try{
      vo.currentTime = 0;
      vo.play().catch(function(){});
    }catch(e){}
    showLine(0);
    bgm.volume = 0.12;              // musik latar turun saat narasi jalan
    syncTimer = setInterval(syncLoop, 80);
  }
  function stopIntro(){
    clearInterval(typeTimer);
    clearInterval(syncTimer);
    try{ vo.pause(); vo.currentTime = 0; }catch(e){}
    bgm.volume = vol.value/100 * 0.3;
  }
  // klik balon / panah = lompat ke awal blok berikutnya (teks & suara tetap sinkron)
  function skipIntro(){
    var t = introTime();
    for(var i=0;i<introData.length;i++){
      if(t < introData[i].t1 * ts){ jumpTo(introData[i].t0 * ts, i); return; }
    }
  }
  function jumpTo(sec, idx){
    if(!vo.paused && !vo.ended){ try{ vo.currentTime = sec; }catch(e){} }
    wallStart = new Date().getTime() - sec * 1000;
    if(idx != null){ showLine(idx); }
  }
  bubble.addEventListener('click', function(){ playKlik(); skipIntro(); });

  // ===== 7. EFEK ANIMASI SAAT DIPENCET (semua tombol) =====
  // Squash + gelombang + bintang. Berlaku untuk btn-mulai, setting, tutup, toggle.
  function pressFX(el, useStars){
    el.addEventListener('pointerdown', function(){
      // restart animasi squash
      el.classList.remove('pressed');
      void el.offsetWidth;
      el.classList.add('pressed');
      setTimeout(function(){ el.classList.remove('pressed'); }, 450);
      // gelombang
      var ring = document.createElement('span');
      ring.className = 'press-ring';
      el.appendChild(ring);
      setTimeout(function(){ ring.remove(); }, 600);
      // bintang mental (opsional, hanya tombol utama)
      if(useStars){
        for(var i=0;i<7;i++){
          (function(){
            var s = document.createElement('span');
            s.className = 'press-star';
            var ang = Math.random()*Math.PI*2;
            var dist = 110 + Math.random()*130;
            s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
            s.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
            s.style.width = s.style.height = (12 + Math.random()*16) + 'px';
            el.appendChild(s);
            setTimeout(function(){ s.remove(); }, 650);
          })();
        }
      }
    });
  }
  pressFX(btnMulai, true);
  pressFX(btnSetting, false);
  pressFX(btnSettingMenu, false);
  pressFX(btnSettingIntro, false);
  pressFX(btnSettingTujuan, false);
  pressFX(btnHomeMenu, false);
  pressFX(btnHomeIntro, false);
  pressFX(btnHomeTujuan, false);
  pressFX(btnPrevTujuan, false);
  pressFX(btnNextTujuan, false);
  pressFX(btnPrevMenu, false);
  pressFX(btnMulaiBelajar, false);
  pressFX(btnKpk, false);
  pressFX(btnFpb, false);
  pressFX(btnTutup, false);
  setTimeout(function(){ document.getElementById('btn-mulai').click(); },250);
  pressFX(tgMusic, false);
  pressFX(tgSfx, false);
  pressFX(tgFull, false);
})();
</script>
</body>
</html>
